name: Weekly event scrape

on:
  schedule:
    # Every Monday at 03:00 UTC. GitHub Actions cron can run several
    # minutes late under load -- that's fine for a weekly job.
    - cron: "0 3 * * 1"
  workflow_dispatch: {} # lets you trigger a run by hand from the Actions tab

# Only one full weekly run at a time -- a second run writing to the same
# output/ files concurrently would race the first.
concurrency:
  group: weekly-scrape
  cancel-in-progress: false

permissions:
  contents: write # needed to commit the updated output/ files back

jobs:
  # Every country scrapes and cleans independently, in parallel, each on
  # its own runner -- instead of one job working through all countries
  # back to back. Adding a country here needs one more `include` entry
  # (matching weekly_full_run.py's COUNTRIES list) plus the matching raw/
  # final paths; nothing else in this workflow changes.
  scrape:
    strategy:
      fail-fast: false # one country's scrape failing shouldn't cancel the others
      matrix:
        include:
          - country: India
            raw: output/raw/Events.xlsx
            final: output/Events_2026.xlsx
          - country: USA
            raw: output/raw/Events_USA.xlsx
            final: output/Events_USA_2026.xlsx
          - country: UK
            raw: output/raw/Events_UK.xlsx
            final: output/Events_UK_2026.xlsx
          - country: SG
            raw: output/raw/Events_SG.xlsx
            final: output/Events_SG_2026.xlsx
          - country: UAE
            raw: output/raw/Events_UAE.xlsx
            final: output/Events_UAE_2026.xlsx
          - country: AUS
            raw: output/raw/Events_AUS.xlsx
            final: output/Events_AUS_2026.xlsx
    runs-on: ubuntu-latest
    timeout-minutes: 180 # one country's worth of real page loads, not all six
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium
        run: playwright install --with-deps chromium

      - name: Scrape + clean ${{ matrix.country }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python weekly_full_run.py --country "${{ matrix.country }}" --engine free

      - name: Upload ${{ matrix.country }} results
        if: always() # upload whatever got produced even if this country's run failed partway
        uses: actions/upload-artifact@v4
        with:
          name: country-${{ matrix.country }}
          path: |
            ${{ matrix.raw }}
            ${{ matrix.final }}
            output/summary_${{ matrix.country }}.json
            output/failures*.csv
          if-no-files-found: warn
          retention-days: 7

  # Runs once, after every country's job above has finished (successfully
  # or not) -- combines their independent results into one Master.xlsx and
  # one weekly_summary.json, then makes the single commit back to the repo.
  # Country jobs never commit anything themselves, so there's no risk of
  # them racing each other on the same branch.
  merge:
    needs: scrape
    if: always() # still merge whatever succeeded even if one country's job failed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download every country's results
        uses: actions/download-artifact@v4
        with:
          pattern: country-*
          path: .
          merge-multiple: true # merges straight into output/... instead of one subfolder per artifact

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Merge into Master.xlsx + combined weekly summary
        run: python weekly_full_run.py --merge-only

      - name: Email digest (optional)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
        run: python -c "from scheduled_run import build_digest, send_email; send_email(build_digest())"

      - name: Commit updated output files
        # Glob patterns, not per-country filenames -- adding a country needs
        # no change here, its output/raw/<Country>.xlsx and
        # output/<Country>_2026.xlsx are picked up automatically.
        # failures*.csv is deliberately excluded from the commit (see
        # .gitignore) -- it's attached as a run artifact below instead.
        run: |
          git config user.name "expertly-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/raw/*.xlsx output/*_2026.xlsx output/Master.xlsx \
                  output/weekly_summary.json
          git diff --staged --quiet || git commit -m "Weekly scrape: $(date -u +'%Y-%m-%d')"
          git push

      - name: Upload run diagnostics as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-run-output
          path: |
            output/failures*.csv
            output/weekly_summary.json
          retention-days: 30
